let s={reviews:{},journal:[],custom:[],log:[],minutes:60};try{Object.assign(s,JSON.parse(localStorage.getItem('fluent-v1')||'{}'))}catch{};const save=()=>localStorage.setItem('fluent-v1',JSON.stringify(s));const v=document.querySelector('#view');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let queue=[],flip=false,mode='en',kind='core',total=0,current='Today';const cards=()=>[...core,...base.filter(c=>!c[0].includes(' / ')),...verbCards,...s.custom];const key=c=>c[3]||c[0];const due=c=>!s.reviews[key(c)]||s.reviews[key(c)].due<=Date.now();function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}}function log(type,ok){s.log.push({type,ok,date:Date.now()});save()}function start(k='all',m='en'){kind=k;mode=m;queue=cards().filter(c=>k==='core'?core.includes(c):k==='due'?due(c):k==='errors'?s.reviews[key(c)]?.errors:k==='verbs'?verbCards.includes(c):true).sort(()=>Math.random()-.5);if(k==='due')queue=queue.sort((a,b)=>Number(!!s.reviews[key(b)])-Number(!!s.reviews[key(a)])||Number(core.includes(b))-Number(core.includes(a))).slice(0,Math.max(20,queue.filter(c=>s.reviews[key(c)]).length+20));total=queue.length;flip=false;current='Practice';render()}function grade(ok){if(!queue.length)return;let c=queue.shift(),r=s.reviews[key(c)]||{level:0,errors:0};if(ok){r.level++;r.due=Date.now()+86400000*[1,3,7,14,30][Math.min(r.level-1,4)]}else{r.level=0;r.errors++;r.due=Date.now();queue.push(c)}s.reviews[key(c)]=r;log('flashcard',ok);flip=false;render()}function show(n){if(current==='Speak'&&n!=='Speak')stopVoice();current=n;render()}let li=0;let vq=[], vn=0, vt=0, vh=false;function beginVerbs(){vq=irregular.flatMap(v=>[1,2].map(n=>({v,n}))).sort(()=>Math.random()-.5);vn=vq.length;vt=0;vh=false;show('Verbs')}function verbCheck(){let q=vq[0];if(!q)return;let a=document.getElementById('verbAnswer').value.trim().toLowerCase();let ok=q.v[q.n].toLowerCase().split('/').includes(a);if(!a)return;log('irregular',ok);vt++;if(ok){vq.shift();render()}else{document.getElementById('verbFeedback').textContent='Réponse : '+q.v[q.n]+'. Réessaie.';vq.push(vq.shift());vh=true;document.getElementById('verbAnswer').value='';document.getElementById('verbAnswer').disabled=true;document.getElementById('verbNext').hidden=false;document.getElementById('verbSubmit').disabled=true}}function verbView(){let q=vq[0];return '<h2>Verb Mastery</h2><section><button onclick="beginVerbs()">Entraînement : 100 verbes</button><p>'+vq.length+' formes restantes · '+vt+' tentatives</p>'+(q?'<h3>'+esc(q.v[0])+' — '+esc(q.v[3])+'</h3><p>'+ (q.n===1?'Prétérit (past simple)':'Participe passé')+'</p><input id="verbAnswer" autocomplete="off" placeholder="Écris la forme"><button id="verbSubmit" onclick="verbCheck()">Vérifier</button><p id="verbFeedback"></p><button id="verbNext" hidden onclick="vh=false;render()">Continuer</button>':'<p>Commence ou recommence une séance.</p>')+'</section><section><h3>Référence : base / prétérit / participe</h3>'+irregular.map(v=>'<p>'+esc(v.slice(0,3).join(' · '))+' — '+esc(v[3])+'</p>').join('')+'</section>'}
function swipeCard(){const el=document.getElementById('card');if(!el)return;el.style.touchAction='pan-y';el.style.transition='transform .18s, background .18s';let x=0,y=0,id=null,moved=false;el.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;x=e.clientX;y=e.clientY;id=e.pointerId;moved=false;el.setPointerCapture(id);el.style.transition='none'});el.addEventListener('pointermove',e=>{if(id!==e.pointerId)return;let dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){moved=true;el.style.transform='translateX('+dx+'px) rotate('+dx/20+'deg)';el.style.background=dx>0?'#36774c':'#a34d4d'}});el.addEventListener('pointerup',e=>{if(id!==e.pointerId)return;let dx=e.clientX-x,dy=e.clientY-y;id=null;el.style.transition='transform .18s, background .18s';if(moved&&Math.abs(dx)>=65&&Math.abs(dx)>Math.abs(dy)){el.style.transform='translateX('+(dx>0?500:-500)+'px)';el.disabled=true;const c=queue[0];setTimeout(()=>{if(queue[0]===c&&document.getElementById('card')===el)grade(dx>0)},150)}else{el.style.transform='';el.style.background='#294b3d'}});el.addEventListener('pointercancel',()=>{id=null;moved=true;el.style.transform='';el.style.background='#294b3d'});el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false}},true)}
const courseNotes=[["Les auxiliaires","Be : I am, you/we/they are, he/she/it is. Past : was/were. Have : I/you/we/they have, he/she/it has. Past : had. Do : do/does ; past : did.","She is ready. / Elle est prête.\nHe has a car. / Il a une voiture.\nDo you know? / Tu sais ?"],["Questions et négations","Avec be ou un modal, inverser sujet et auxiliaire. Sinon do/does/did + base. Pour nier, ajouter not à l’auxiliaire.","Are you ready? Can you swim? Does she work? He doesn't work."],["Contractions","I'm, you're, he's, we've, they've ; don't, doesn't, didn't ; isn't, aren't, wasn't, weren't ; haven't, hasn't ; can't, won't, wouldn't. I'd = I had ou I would selon le contexte.","I'd like some coffee. / J'aimerais du café."],["Prépositions temporelles","At + heure ; on + jour/date ; in + mois/année/période. Since + point de départ ; for + durée.","At 8, on Monday, in June. I've lived here for two years."],["Articles et quantité","A/an pour un élément indéfini singulier ; the pour un élément identifié. Much avec indénombrables, many avec pluriels ; some/any selon le contexte.","A book, an apple, the door. How much water? How many people?"],["Pronoms","I/me/my, you/you/your, he/him/his, she/her/her, it/it/its, we/us/our, they/them/their.","She told me her name. / Elle m'a dit son nom."],["Ordre des mots","Sujet + verbe + complément. Adverbes de fréquence avant le verbe principal mais après be.","I often go there. She is always late."],["Adjectifs et comparaison","Adjectif avant le nom, sans accord. Courts : -er/-est ; longs : more/most. Good → better → best.","A beautiful house. This is better than that."]];function courseView(){return '<h2>Courses — Fiches de rappel</h2><input id="courseSearch" placeholder="Rechercher une règle" oninput="filterCourses(this.value)"><div id="courseList"><h3 class="courseGroup">Les fondamentaux</h3>'+courseNotes.map(a=>'<details class="course"><summary>'+esc(a[0])+'</summary><p>'+esc(a[1])+'</p><p style="white-space:pre-line">'+esc(a[2])+'</p></details>').join('')+lessons.map(a=>'<details class="course"><summary>'+esc(a[0])+'</summary><p>'+esc(a[1])+'</p><p class="courseExample">Exemple :<br>'+esc(a[2].replace('___',a[3]))+'</p></details>').join('')+'</div><button onclick="show(\'Learn\')">Passer aux exercices</button>'}function filterCourses(q){document.querySelectorAll('.course').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(q.toLowerCase()))}
let recorder=null, mic=null, audioURL='', recBusy=false;async function recordVoice(){if(recBusy||recorder?.state==='recording')return;recBusy=true;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Enregistrement non disponible sur ce navigateur');mic=await navigator.mediaDevices.getUserMedia({audio:true});if(current!=='Speak'){mic.getTracks().forEach(t=>t.stop());mic=null;return}let chunks=[];recorder=new MediaRecorder(mic);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||chunks[0]?.type||'audio/mp4'}));mic?.getTracks().forEach(t=>t.stop());mic=null;if(current==='Speak')render()};recorder.start();render()}catch(e){mic?.getTracks().forEach(t=>t.stop());mic=null;let el=document.getElementById('recStatus');if(el)el.textContent='Micro indisponible : '+e.message}finally{recBusy=false}}function stopVoice(){if(recorder?.state==='recording')recorder.stop()}function voicePanel(){return '<section><h3>Mon enregistrement</h3><button onclick="recordVoice()" '+(recorder?.state==='recording'?'disabled':'')+'>● Enregistrer</button> <button onclick="stopVoice()" '+(recorder?.state==='recording'?'':'disabled')+'>■ Arrêter</button><p id="recStatus">'+(recorder?.state==='recording'?'Enregistrement en cours…':'Autorise le microphone pour parler.')+'</p>'+(audioURL?'<audio controls style="width:100%" src="'+audioURL+'"></audio>':'')+'</section>'}
const dailyTasks=[["Réviser mes cours",5,"Courses"],["Flashcards de vocabulaire",15,"Practice"],["Verbes irréguliers",5,"Verbs"],["Exercices de grammaire",10,"Learn"],["Compréhension orale",10,"Listen"],["Expression orale",10,"Speak"],["Journal en anglais",5,"Journal"]];function dayKey(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function dailyState(){s.daily=s.daily||{};return s.daily[dayKey()]||(s.daily[dayKey()]=[])}function toggleDaily(i){let a=dailyState();a[i]=!a[i];save();render()}function dailyOpen(i){if(i===1)start('due');else show(dailyTasks[i][2])}function dailyView(){let a=dailyState(),n=dailyTasks.filter((t,i)=>a[i]).length,mins=dailyTasks.reduce((sum,t,i)=>sum+(a[i]?t[1]:0),0);return '<h2>My daily plan</h2><p>'+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</p><section><div style="display:flex;align-items:center;justify-content:space-between"><h1 style="color:#b8ef97">'+Math.round(n/7*100)+' %</h1><span>'+n+'/7 tâches</span></div><progress max="7" value="'+n+'"></progress><p>'+mins+' / 60 minutes prévues</p>'+(n===7?'<h3>🎉 Daily goal completed!</h3>':'')+'</section><section class="dailyList">'+dailyTasks.map((t,i)=>'<div class="dailyTask"><label><input type="checkbox" '+(a[i]?'checked':'')+' onchange="toggleDaily('+i+')"><span class="'+(a[i]?'doneTask':'')+'">'+esc(t[0])+'<small>'+t[1]+' min</small></span></label><button class="alt" onclick="dailyOpen('+i+')" aria-label="Ouvrir '+esc(t[0])+'">→</button></div>').join('')+'</section><p>Coche une tâche lorsque tu as terminé ta séance.</p>'}
function render(){document.querySelector('#nav').innerHTML=['Today','Courses','Learn','Practice','Verbs','Listen','Speak','Journal','Progress'].map(n=>'<button class="'+(n===current?'':'alt')+'" onclick="show(\''+n+'\')">'+n+'</button>').join('');let c=queue[0];if(current==='Courses'){v.innerHTML=courseView();return;}if(current==='Verbs'){start('verbs');return;}if(current==='Today')v.innerHTML=dailyView();if(current==='Practice')v.innerHTML='<h2>Practice Arena</h2><label>Choisir le deck<select id="deckChoice"><option value="core">Essential English</option><option value="all">Toutes les cartes</option><option value="verbs">Verbes irréguliers</option><option value="errors">Mes erreurs</option><option value="due">Révisions du jour</option></select></label><label>Direction<select id="direction"><option value="en">Anglais → Français</option><option value="fr">Français → Anglais</option></select></label><button onclick="start(document.getElementById(\'deckChoice\').value,document.getElementById(\'direction\').value)">Commencer ce deck</button><section><div style="display:flex;justify-content:space-between"><strong>'+ (total-queue.length)+' connues</strong><strong>'+queue.length+' restantes</strong></div><progress max="'+(total||1)+'" value="'+(total-queue.length)+'"></progress>'+(c?'<button id="card" style="width:100%;background:#294b3d;color:white;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:18px" onclick="flip=!flip;render()"><span>'+esc(flip?(mode==='en'?c[1]:c[0]):(mode==='en'?c[0]:c[1]))+'</span></button>'+('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="bad" onclick="grade(false)">✗ Je ne connais pas</button><button onclick="grade(true)">✓ Je connais</button></div>'):(total?'<h2>🎉 Deck terminé !</h2><p>Tu as réussi les '+total+' cartes de cette séance. Reviens demain pour consolider tes acquis.</p><button onclick="start(kind,mode)">Recommencer le même deck</button>':'<p>Choisis un deck pour commencer.</p>'))+'</section><section><h3>Ajouter une carte</h3><input id="en" placeholder="English"><input id="fr" placeholder="Français"><button onclick="add()">Ajouter</button></section>';if(current==='Practice'){document.getElementById('deckChoice').value=kind;document.getElementById('direction').value=mode;swipeCard();}if(current==='Learn'){li=((li%lessons.length)+lessons.length)%lessons.length;let l=lessons[li];v.innerHTML='<h2>Grammar workout</h2><section><h3>'+l[0]+'</h3><p>'+l[1]+'</p><p>'+l[2]+'</p><input id="ans" placeholder="Réponse"><button onclick="check()">Vérifier</button><p id="feedback"></p><button class="alt" onclick="li=(li+1)%lessons.length;render()">Autre notion</button></section>'}if(current==='Listen')v.innerHTML='<h2>Listening & shadowing</h2><section><button onclick="speak(cards()[li%cards().length][2])">Écouter la phrase</button><textarea id="dict" placeholder="Écris ce que tu entends"></textarea><button onclick="document.getElementById(\'trans\').textContent=cards()[li%cards().length][2]">Transcription</button><p id="trans"></p><button onclick="li++;render()">Phrase suivante</button></section><section><h3>Ta vidéo personnelle</h3><input type="file" accept="video/*" onchange="document.getElementById(\'vid\').src=URL.createObjectURL(this.files[0])"><video id="vid" controls style="width:100%"></video><textarea placeholder="Colle ta transcription pour le shadowing"></textarea></section>';if(current==='Speak')v.innerHTML='<h2>Speak aloud</h2><section><h3>'+['Tell me about your day.','Describe your dream job.','What did you do last weekend?','What would you do if you could travel anywhere?','Explain a problem you solved recently.'][li%5]+'</h3><p>Parle pendant deux minutes sans préparer tes phrases.</p><button onclick="li++;render()">Autre sujet</button><button onclick="coach(\'Simule une conversation anglaise B2 avec moi, une question à la fois, puis corrige mes erreurs.\')">Conversation avec ChatGPT</button></section>'+voicePanel();if(current==='Journal')v.innerHTML='<h2>Daily journal</h2><textarea id="entry" placeholder="Today, I…"></textarea><button onclick="journal()">Enregistrer</button> <button onclick="coach(\'Corrige mon journal en anglais, explique mes erreurs et propose des flashcards : \'+document.getElementById(\'entry\').value)">Corriger avec ChatGPT</button>'+s.journal.slice().reverse().map(j=>'<section><small>'+new Date(j.date).toLocaleDateString()+'</small><p>'+esc(j.text)+'</p></section>').join('');if(current==='Progress')v.innerHTML='<h2>Your progress</h2><section><h3>'+s.log.length+' tentatives</h3><p>'+Object.values(s.reviews).filter(r=>r.level>=3).length+' cartes consolidées · '+s.journal.length+' journaux</p><p>'+s.log.filter(x=>x.ok).length+' réponses réussies</p></section><button onclick="backup()">Exporter mes données</button><label>Restaurer une sauvegarde<input type="file" accept=".json" onchange="restore(this)"></label>'}
function add(){let a=document.querySelector('#en').value.trim(),b=document.querySelector('#fr').value.trim();if(a&&b&&!cards().some(c=>c[0]===a)){s.custom.push([a,b,'']);save();render()}}function check(){let ok=document.querySelector('#ans').value.trim().toLowerCase().replace(/’/g,"'")===lessons[li][3].toLowerCase();log('grammar',ok);document.querySelector('#feedback').textContent=ok?'Correct!':'Réponse : '+lessons[li][3]+'. Réessaie.'}function journal(){let t=document.querySelector('#entry').value.trim();if(t){s.journal.push({text:t,date:Date.now()});save();render()}}async function coach(t){try{await navigator.clipboard.writeText(t);alert('Prompt copié. Colle-le dans ChatGPT.')}catch{prompt('Copie ce prompt',t)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='fluent-backup.json';a.click()}async function restore(el){try{let n=JSON.parse(await el.files[0].text());if(!Array.isArray(n.log)||!Array.isArray(n.custom)||!Array.isArray(n.journal)||!n.reviews)throw Error();if(confirm('Remplacer les données locales ?')){s=n;save();render()}}catch{alert('Sauvegarde invalide')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
