<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102820"><link rel="manifest" href="manifest.webmanifest"><title>Fluent — Personal English Coach</title><style> *{box-sizing:border-box}body{margin:0;background:#102820;color:#f0f8f2;font:17px system-ui}main{max-width:700px;margin:auto;padding:24px 18px 100px}h1{font-size:42px;margin:12px 0}h2{font-size:24px}small,p{color:#bdd0c4}section,article{background:#1c392e;border-radius:18px;padding:20px;margin:14px 0}button,select,input,textarea{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px 0}button{background:#b8ef97;color:#142c20;cursor:pointer;font-weight:600}button.alt{background:#345448;color:white}input,textarea,select{background:#f1f6ef;color:#162d21;width:100%}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{font-size:13px}textarea{min-height:120px}progress{width:100%;accent-color:#b8ef97}#card{min-height:150px;display:grid;place-items:center;text-align:center;font-size:26px}.bad{background:#f4b9a9}label{display:block}</style><main><small>PERSONAL ENGLISH COACH · V0.1</small><h1>fluent.</h1><nav id="nav"></nav><div id="view"></div></main><script>
const base=[
['figure out','comprendre / trouver une solution','I finally figured it out.'],['get used to','s’habituer à','I am getting used to it.'],['look forward to','avoir hâte de','I look forward to seeing you.'],['fair enough','d’accord / c’est raisonnable','Fair enough, I understand.'],['no worries','pas de souci','No worries, take your time.'],['I am up for it','je suis partant','I am up for it.'],['What have you been up to?','Quoi de neuf ?','What have you been up to?'],['It depends on','Cela dépend de','It depends on the weather.'],['I did not mean to','Je ne voulais pas / pas fait exprès','I did not mean to upset you.'],['run out of','ne plus avoir de','We ran out of milk.'],['catch up','rattraper / prendre des nouvelles','Let us catch up soon.'],['make up your mind','se décider','Have you made up your mind?'],['turn out','s’avérer','It turned out well.'],['put off','reporter','Do not put it off.'],['come across','tomber sur','I came across an old photo.'],['bring up','aborder un sujet','She brought up a good point.'],['deal with','gérer','I can deal with it.'],['give up','abandonner','Never give up.'],['hang out','passer du temps ensemble','We hang out on Fridays.'],['by the way','au fait','By the way, how are you?'],
['go / went / gone','aller','I went home.'],['take / took / taken','prendre','I took the bus.'],['see / saw / seen','voir','I have seen it.'],['write / wrote / written','écrire','She wrote a letter.'],['eat / ate / eaten','manger','I have eaten.'],['speak / spoke / spoken','parler','We spoke yesterday.'],['choose / chose / chosen','choisir','I chose this one.'],['know / knew / known','savoir','I knew the answer.']
];
const lessons=[['Present perfect','have/has + participe passé : expérience ou lien avec le présent.','I ___ never been to London.','have'],['Past simple','Action terminée dans le passé.','Yesterday I ___ to work. (go)','went'],['Questions','Do/does/did + sujet + base verbale.','___ you like coffee?','Do'],['Conditionnel','If + past simple, would + base verbale.','If I had time, I ___ travel.','would'],['Depuis','Since + point de départ ; for + durée.','I have lived here ___ two years.','for'],['Accord','Agree est un verbe, sans be.','I ___ with you.','agree'],['Present continuous','be + verbe-ing : action en cours.','She ___ working now.','is'],['Comparatif','Adjectif court + er + than.','This is ___ than that. (easy)','easier']];
let s={reviews:{},journal:[],custom:[],log:[],minutes:60};try{Object.assign(s,JSON.parse(localStorage.getItem('fluent-v1')||'{}'))}catch{};const save=()=>localStorage.setItem('fluent-v1',JSON.stringify(s));const v=document.querySelector('#view');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let queue=[],flip=false,mode='en',kind='all',total=0,current='Today';const cards=()=>[...base,...s.custom];const key=c=>c[0];const due=c=>!s.reviews[key(c)]||s.reviews[key(c)].due<=Date.now();function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}}function log(type,ok){s.log.push({type,ok,date:Date.now()});save()}function start(k='all',m='en'){kind=k;mode=m;queue=cards().filter(c=>k==='due'?due(c):k==='errors'?s.reviews[key(c)]?.errors:k==='verbs'?c[0].includes(' / '):true).sort(()=>Math.random()-.5);total=queue.length;flip=false;current='Practice';render()}function grade(ok){let c=queue.shift(),r=s.reviews[key(c)]||{level:0,errors:0};if(ok){r.level++;r.due=Date.now()+86400000*[1,3,7,14,30][Math.min(r.level-1,4)]}else{r.level=0;r.errors++;r.due=Date.now();queue.push(c)}s.reviews[key(c)]=r;log('flashcard',ok);flip=false;render()}function show(n){current=n;render()}let li=0;function render(){document.querySelector('#nav').innerHTML=['Today','Learn','Practice','Listen','Speak','Journal','Progress'].map(n=>'<button class="'+(n===current?'':'alt')+'" onclick="show(\''+n+'\')">'+n+'</button>').join('');let c=queue[0];if(current==='Today')v.innerHTML='<h2>Your daily plan</h2><section><h2>'+cards().filter(due).length+' cartes à réviser</h2><button onclick="start(\'due\')">Commencer mes révisions</button></section><section>5 min théorie · 20 min pratique · 10 min écoute · 15 min oral · 10 min journal<br><button onclick="show(\'Learn\')">Grammaire</button> <button onclick="show(\'Listen\')">Écouter</button> <button onclick="show(\'Speak\')">Parler</button></section>';if(current==='Practice')v.innerHTML='<h2>Practice Arena</h2><button onclick="start()">Toutes les cartes</button> <button onclick="start(\'all\',\'fr\')">FR → EN</button> <button onclick="start(\'errors\')">Mes erreurs</button> <button onclick="start(\'verbs\')">Verbes</button><section><progress max="'+(total||1)+'" value="'+(total-queue.length)+'"></progress><p>'+queue.length+' restantes</p>'+(c?'<article id="card">'+esc(flip?(mode==='en'?c[1]:c[0]):(mode==='en'?c[0]:c[1]))+'</article>'+(flip?'<p>'+esc(c[2]||'')+'</p><button onclick="speak(queue[0][0])">Écouter</button> <button class="bad" onclick="grade(false)">Raté / hésitation</button> <button onclick="grade(true)">Réussi</button>':'<input id="guess" placeholder="Essaie de répondre sans regarder"><button onclick="flip=true;render()">Afficher la réponse</button>'):'<p>Choisis un entraînement ou recommence.</p>')+'</section><section><h3>Ajouter une carte</h3><input id="en" placeholder="English"><input id="fr" placeholder="Français"><button onclick="add()">Ajouter</button></section>';if(current==='Learn'){let l=lessons[li];v.innerHTML='<h2>Grammar workout</h2><section><h3>'+l[0]+'</h3><p>'+l[1]+'</p><p>'+l[2]+'</p><input id="ans" placeholder="Réponse"><button onclick="check()">Vérifier</button><p id="feedback"></p><button class="alt" onclick="li=(li+1)%lessons.length;render()">Autre notion</button></section>'}if(current==='Listen')v.innerHTML='<h2>Listening & shadowing</h2><section><button onclick="speak(cards()[li%cards().length][2])">Écouter la phrase</button><textarea id="dict" placeholder="Écris ce que tu entends"></textarea><button onclick="document.getElementById(\'trans\').textContent=cards()[li%cards().length][2]">Transcription</button><p id="trans"></p><button onclick="li++;render()">Phrase suivante</button></section><section><h3>Ta vidéo personnelle</h3><input type="file" accept="video/*" onchange="document.getElementById(\'vid\').src=URL.createObjectURL(this.files[0])"><video id="vid" controls style="width:100%"></video><textarea placeholder="Colle ta transcription pour le shadowing"></textarea></section>';if(current==='Speak')v.innerHTML='<h2>Speak aloud</h2><section><h3>'+['Tell me about your day.','Describe your dream job.','What did you do last weekend?','What would you do if you could travel anywhere?','Explain a problem you solved recently.'][li%5]+'</h3><p>Parle pendant deux minutes sans préparer tes phrases.</p><button onclick="li++;render()">Autre sujet</button><p>Utilise le dictaphone de ton téléphone pour t’enregistrer.</p><button onclick="coach(\'Simule une conversation anglaise B2 avec moi, une question à la fois, puis corrige mes erreurs.\')">Conversation avec ChatGPT</button></section>';if(current==='Journal')v.innerHTML='<h2>Daily journal</h2><textarea id="entry" placeholder="Today, I…"></textarea><button onclick="journal()">Enregistrer</button> <button onclick="coach(\'Corrige mon journal en anglais, explique mes erreurs et propose des flashcards : \'+document.getElementById(\'entry\').value)">Corriger avec ChatGPT</button>'+s.journal.slice().reverse().map(j=>'<section><small>'+new Date(j.date).toLocaleDateString()+'</small><p>'+esc(j.text)+'</p></section>').join('');if(current==='Progress')v.innerHTML='<h2>Your progress</h2><section><h3>'+s.log.length+' tentatives</h3><p>'+Object.values(s.reviews).filter(r=>r.level>=3).length+' cartes consolidées · '+s.journal.length+' journaux</p><p>'+s.log.filter(x=>x.ok).length+' réponses réussies</p></section><button onclick="backup()">Exporter mes données</button><label>Restaurer une sauvegarde<input type="file" accept=".json" onchange="restore(this)"></label>'}
function add(){let a=document.querySelector('#en').value.trim(),b=document.querySelector('#fr').value.trim();if(a&&b&&!cards().some(c=>c[0]===a)){s.custom.push([a,b,'']);save();render()}}function check(){let ok=document.querySelector('#ans').value.trim().toLowerCase()===lessons[li][3].toLowerCase();log('grammar',ok);document.querySelector('#feedback').textContent=ok?'Correct!':'Réponse : '+lessons[li][3]+'. Réessaie.'}function journal(){let t=document.querySelector('#entry').value.trim();if(t){s.journal.push({text:t,date:Date.now()});save();render()}}async function coach(t){try{await navigator.clipboard.writeText(t);alert('Prompt copié. Colle-le dans ChatGPT.')}catch{prompt('Copie ce prompt',t)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='fluent-backup.json';a.click()}async function restore(el){try{let n=JSON.parse(await el.files[0].text());if(!Array.isArray(n.log)||!Array.isArray(n.custom)||!Array.isArray(n.journal)||!n.reviews)throw Error();if(confirm('Remplacer les données locales ?')){s=n;save();render()}}catch{alert('Sauvegarde invalide')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
